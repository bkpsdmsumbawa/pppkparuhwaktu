<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOWNLOAD PK 2026</title>
    <!-- Tailwind CSS untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 h-screen w-screen overflow-hidden flex flex-col m-0 p-0 font-sans">

    <!-- Loading Screen Modern -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 text-white transition-opacity duration-500">
        <div class="relative flex items-center justify-center mb-4">
            <div class="w-16 h-16 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
            <div class="absolute text-xs font-bold tracking-wider text-indigo-400">PK</div>
        </div>
        <h2 class="text-lg font-semibold tracking-wide mb-1">DOWNLOAD PK 2026</h2>
        <p class="text-sm text-slate-400">Menghubungkan ke sistem, mohon tunggu sebentar...</p>
    </div>

    <!-- Header Minimalis Profesional -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-10 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-indigo-200">
                PK
            </div>
            <div>
                <h1 class="text-sm font-bold text-slate-800 leading-tight">DOWNLOAD PK 2026</h1>
                <p class="text-xs text-slate-500">Sistem Layanan Dokumen & Aplikasi</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="reloadApp()" class="text-xs text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition-colors font-medium flex items-center gap-1.5 shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Muat Ulang
            </button>
        </div>
    </header>

    <!-- Area Konten Utama (Iframe Apps Script) -->
    <main class="flex-1 w-full relative bg-slate-100 overflow-hidden">
        <iframe 
            id="appFrame"
            src="https://script.google.com/macros/s/AKfycbwh5nDKSaU55pBSoxWnIyF7lFhw-Xh5brlKqwtK-bzJK-EkwaHuDSVz8QuQQb2HWOYrNg/exec" 
            class="w-full h-full border-none block"
            onload="hideLoader()">
        </iframe>
    </main>

    <!-- JavaScript Pendukung -->
    <script>
        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500); // Menyesuaikan durasi transisi 500ms
        }

        function reloadApp() {
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            const iframe = document.getElementById('appFrame');
            iframe.src = iframe.src;
        }

        // Pengaman (Fallback): Sembunyikan loader otomatis setelah 8 detik jika event onload terlambat
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader && loader.style.display !== 'none') {
                hideLoader();
            }
        }, 8000);
    </script>
</body>
</html>
